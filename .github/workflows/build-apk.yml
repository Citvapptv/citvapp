name: Build Android APK

on:
  push:
    branches:
      - Kryptocasino
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Prepare build logs directory
        run: mkdir -p build-logs

      - name: Build web app
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build-logs/vite-build.log

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync Capacitor Android project
        run: |
          set -o pipefail
          if [ ! -d android ]; then
            npx cap add android 2>&1 | tee build-logs/capacitor-add-android.log
          fi
          npx cap sync android 2>&1 | tee build-logs/capacitor-sync.log

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        run: |
          set -o pipefail
          cd android
          ./gradlew assembleDebug 2>&1 | tee ../build-logs/gradle-assemble-debug.log

      - name: Verify debug APK
        env:
          APK_PATH: android/app/build/outputs/apk/debug/app-debug.apk
        run: |
          test -f "$APK_PATH"

          APK_SIZE_BYTES=$(stat -c%s "$APK_PATH")
          APK_SHA256=$(sha256sum "$APK_PATH" | awk '{print $1}')

          unzip -l "$APK_PATH" | tee build-logs/app-debug.apk.contents.txt
          unzip -p "$APK_PATH" AndroidManifest.xml > build-logs/AndroidManifest.xml

          grep -q "assets/public/" build-logs/app-debug.apk.contents.txt

          {
            echo "APK_PATH=$APK_PATH"
            echo "APK_SIZE_BYTES=$APK_SIZE_BYTES"
            echo "APK_SHA256=$APK_SHA256"
          } >> "$GITHUB_ENV"

          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## Debug APK verification
          - APK path: \`$APK_PATH\`
          - APK size: \`$APK_SIZE_BYTES\` bytes
          - SHA-256: \`$APK_SHA256\`
          - Manifest extracted: ✅
          - Capacitor web assets present: ✅
          EOF

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Delete existing "latest-debug" release (if any)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest-debug --yes --cleanup-tag || true
        continue-on-error: true

      - name: Create GitHub Release and upload APK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create latest-debug \
            --title "Latest Debug Build" \
            --notes "Automated debug APK build from the \`Kryptocasino\` branch.

          **Commit:** \`${{ github.sha }}\`
          **Built at:** $(date -u '+%Y-%m-%d %H:%M UTC')" \
            --target ${{ github.sha }} \
            android/app/build/outputs/apk/debug/app-debug.apk

          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/latest-debug" > build-logs/release.json

          RELEASE_PAGE_URL=$(jq -r '.html_url' build-logs/release.json)
          APK_DOWNLOAD_URL=$(jq -r '.assets[] | select(.name=="app-debug.apk") | .browser_download_url' build-logs/release.json)

          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## Release links
          - Release page: $RELEASE_PAGE_URL
          - APK download: $APK_DOWNLOAD_URL
          EOF

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build-logs
          if-no-files-found: error
          retention-days: 30
